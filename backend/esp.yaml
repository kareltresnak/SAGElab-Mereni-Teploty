esphome:

  name: esp32-<ESP32 Location>

  friendly_name: <ESP32 Location>

  min_version: 2026.4.0

  name_add_mac_suffix: false

  on_boot:

    priority: -100 

    then:

      - delay: 65s

      - sim800l.http_post:

          url: "<IP_ADDRESS>/api/data"

          body: !lambda |-

            return str_sprintf("{\"device_id\": \"%d\", \"device_name\": \"%s\", \"temperature\": %.1f}", <DEVICE_ID>, <DEVICE_NAME>, id(temp).state);

          content_type: "application/json"



json:

esp32:

  board: esp32dev

  framework:

    type: arduino



deep_sleep:

  id: NIGHT

  sleep_duration: 

    minutes: 1

  run_duration: 

    default: 

      seconds: 80



web_server:

  port: 80

  version: 1



external_components:

  - source:

      type: git

      url: https://github.com/melnijir/esphome

      ref: sim800l_http_extension

    components:

      [sim800l]



uart:

  id: uart_bus

  tx_pin: GPIO27

  rx_pin: GPIO26

  baud_rate: 115200



switch:

  - platform: gpio

    id: PWR

    pin: GPIO23

    restore_mode: ALWAYS_ON

  - platform: gpio

    pin: GPIO13

    id: LED



logger:

  baud_rate: 0



api:



ota:

- platform: esphome



wifi:

  ssid: !secret wifi_ssid

  password: !secret wifi_password



sim800l:

  id: gsm

  uart_id: uart_bus

  apn: "internet"

  on_http_response:

    - lambda: |-

        ESP_LOGI("gprs", "HTTP response %d: %s", status_code, body.c_str());

        json::parse_json(body, [](JsonObject root) -> bool {

          if (!root.containsKey("blink")) {

            return false;

          }

          bool blink_state = root["blink"].as<bool>();

          if (blink_state) {

            id(blink_and_sleep).execute();

          }

          return true;

        });

    - if:

          condition:

            lambda: |-

              bool has_blink = false;

                json::parse_json(body, [&has_blink](JsonObject root) -> bool {

                  has_blink = root.containsKey("blink");

                  return true;

                });

                return !has_blink;

          then:

            - deep_sleep.enter: NIGHT



script:

  - id: blink_and_sleep

    then:

      - repeat:

          count: 5

          then:

            - switch.turn_on: LED

            - delay: 500ms

            - switch.turn_off: LED

            - delay: 500ms

      - deep_sleep.enter: NIGHT



one_wire:

  - platform: gpio

    pin: GPIO33



sensor:

  - platform: dallas_temp

    name: temperature

    update_interval: 5s

    id: temp